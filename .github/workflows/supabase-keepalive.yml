name: Supabase Keep-Alive

on:
  schedule:
    # Every 4 days at 08:00 UTC — prevents free-tier pause (7-day inactivity limit)
    - cron: "0 8 */4 * *"
  workflow_dispatch: # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing required secrets SUPABASE_URL or SUPABASE_ANON_KEY"
            exit 1
          fi

          # queries keepalive table — anon SELECT policy, hits PostgreSQL directly
          # curl failure (e.g. exit 6 = DNS gone => project paused) must not abort
          # before we print a diagnosis, so don't let set -e swallow it.
          HTTP_STATUS=$(curl -s --retry 3 --retry-all-errors -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/keepalive?select=id" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}") || CURL_RC=$?

          if [ -n "${CURL_RC:-}" ]; then
            echo "::error::curl exited ${CURL_RC} (6 = could not resolve host: the Supabase project is likely PAUSED — restore it in the dashboard)"
            exit 1
          fi

          echo "HTTP status: ${HTTP_STATUS}"
          cat /tmp/response.json

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Supabase ping failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi

          echo "Supabase keep-alive ping succeeded at $(date -u)"
